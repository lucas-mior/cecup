name: Test on various platforms CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-script-check:
    name: Build script syntax checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shell used by local validation
        run: |
          sudo apt-get update
          sudo apt-get install -y dash

      - name: Check build script syntax
        run: |
          sh -n build.sh
          bash -n build.sh
          dash -n build.sh

  ubuntu:
    runs-on: ubuntu-latest
    needs: build-script-check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Ubuntu apt package cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ubuntu-apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/tests.yml') }}
          restore-keys: |
            ubuntu-apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Ubuntu build inputs
        run: |
          apt_archives=$RUNNER_TEMP/apt-archives
          mkdir -p "$apt_archives/partial"
          chmod -R 777 "$apt_archives"

          sudo apt-get update
          sudo apt-get \
            -o Dir::Cache::archives="$apt_archives" \
            install -y gettext libgtk-4-dev pkg-config rsync xvfb

      - name: Print tool versions
        run: |
          uname -a
          cc --version
          pkg-config --modversion gtk4
          msgfmt --version | head -n 1
          rsync --version | head -n 1

      - name: Build app
        run: ./build.sh build

      - name: Run tests
        run: |
          GDK_BACKEND=x11 xvfb-run -a \
            --server-args='-screen 0 1280x1024x24' \
            ./build.sh test

  macos:
    name: Native macOS build and tests
    runs-on: macos-latest
    needs: build-script-check

    env:
      CC: clang
      CECUP_TRANSFER_BACKEND: manual

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Homebrew download cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/tests.yml') }}
          restore-keys: |
            macos-brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Install macOS build inputs
        run: |
          brew install gettext gtk4 pkg-config

      - name: Configure Homebrew environment
        run: |
          brew_prefix=$(brew --prefix)
          gettext_prefix=$(brew --prefix gettext)

          echo "$gettext_prefix/bin" >> "$GITHUB_PATH"
          echo "CECUP_TEST_TMPDIR=$RUNNER_TEMP/cecup-tests" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$gettext_prefix/lib/pkgconfig:$brew_prefix/lib/pkgconfig:$brew_prefix/share/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Print tool versions
        run: |
          uname -a
          clang --version
          pkg-config --modversion gtk4
          msgfmt --version | head -n 1

      - name: Build app
        run: ./build.sh build

      - name: Verify built executable
        run: |
          test -x bin/cecup
          file bin/cecup
          otool -L bin/cecup

      - name: Run portable tests with manual backend
        run: ./build.sh test

      - name: Verify staged install layout
        run: |
          DESTDIR="$RUNNER_TEMP/stage" \
          PREFIX="/usr/local" \
          ./build.sh install

          test -x "$RUNNER_TEMP/stage/usr/local/bin/cecup"
          test -f "$RUNNER_TEMP/stage/usr/local/man/man1/cecup.1"
          test -f "$RUNNER_TEMP/stage/usr/local/etc/cecup/cecup.conf"
          test -f "$RUNNER_TEMP/stage/usr/local/etc/cecup/ignore.conf"
          test ! -f "$RUNNER_TEMP/stage/usr/local/share/applications/cecup.desktop"

      - name: Upload macOS build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cecup-macos-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: ignore
          path: |
            bin/cecup
            po/*/LC_MESSAGES/*.mo
            ${{ runner.temp }}/stage/usr/local/bin/cecup
            ${{ runner.temp }}/stage/usr/local/etc/cecup/*

  freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD VM
    needs: build-script-check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and Test
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          cache-after-prepare: true
          prepare: |
            pkg install -y gettext-tools gtk4 pkgconf xorg-vfbserver
          run: |
            export CECUP_TRANSFER_BACKEND=manual
            export PKG_CONFIG=pkgconf

            cc --version
            pkgconf --modversion gtk4
            msgfmt --version | head -n 1
            command -v Xvfb
            ./build.sh build

            Xvfb :99 -screen 0 1280x1024x24 >/tmp/cecup-xvfb.log 2>&1 &
            xvfb_pid=$!
            export DISPLAY=:99
            export GDK_BACKEND=x11
            sleep 2

            if ! ./build.sh test; then
              cat /tmp/cecup-xvfb.log
              kill "$xvfb_pid" || true
              exit 1
            fi

            kill "$xvfb_pid" || true

  netbsd:
    runs-on: ubuntu-latest
    name: NetBSD VM
    needs: build-script-check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and Test
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          cache-after-prepare: true
          prepare: |
            export PATH="/usr/pkg/sbin:/usr/pkg/bin:$PATH"

            install_netbsd_x_sets() {
              if [ -r /usr/X11R7/lib/libX11.so.7 ] && [ -x /usr/X11R7/bin/Xvfb ]; then
                echo "NetBSD X sets are already installed"
                return 0
              fi

              release=$(uname -r)
              machine=$(uname -m)

              case "$machine" in
                x86_64)
                  machine=amd64
                  ;;
              esac

              sets_url="https://cdn.netbsd.org/pub/NetBSD/NetBSD-${release}/${machine}/binary/sets"
              workdir=$(mktemp -d /tmp/cecup-xsets.XXXXXX)

              echo "Installing NetBSD X sets from $sets_url"

              for set_name in xbase xcomp xfont xetc xserver; do
                archive=

                for suffix in tar.xz tgz; do
                  candidate="$workdir/$set_name.$suffix"

                  if ftp -o "$candidate" "$sets_url/$set_name.$suffix"; then
                    archive=$candidate
                    break
                  fi

                  rm -f "$candidate"
                done

                if [ -z "$archive" ]; then
                  echo "Could not download NetBSD X set: $set_name" >&2
                  exit 1
                fi

                case "$archive" in
                  *.tar.xz)
                    tar -C / -xJpf "$archive"
                    ;;
                  *.tgz)
                    tar -C / -xzpf "$archive"
                    ;;
                  *)
                    echo "Unknown NetBSD X set archive format: $archive" >&2
                    exit 1
                    ;;
                esac
              done

              rm -rf "$workdir"
            }

            install_pkg() {
              package=$1

              if pkg_info -qe "$package" \
                  || pkg_info -qe "$package-[0-9]*"; then
                echo "$package is already installed"
                return 0
              fi

              pkg_add -v "$package"
            }

            install_netbsd_x_sets
            install_pkg pkgconf
            install_pkg gettext-tools
            install_pkg gtk4
          run: |
            export PATH="/usr/pkg/sbin:/usr/pkg/bin:/usr/X11R7/bin:$PATH"
            export CECUP_TRANSFER_BACKEND=manual
            export PKG_CONFIG=pkgconf
            export PKG_CONFIG_PATH="/usr/pkg/lib/pkgconfig:/usr/X11R7/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            uname -a
            cc --version
            pkgconf --modversion gtk4
            msgfmt --version | head -n 1
            command -v Xvfb
            ./build.sh build

            Xvfb :99 -screen 0 1280x1024x24 >/tmp/cecup-xvfb.log 2>&1 &
            xvfb_pid=$!
            export DISPLAY=:99
            export GDK_BACKEND=x11
            sleep 2

            if ! ./build.sh test; then
              cat /tmp/cecup-xvfb.log
              kill "$xvfb_pid" || true
              exit 1
            fi

            kill "$xvfb_pid" || true
